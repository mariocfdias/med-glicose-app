<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SmartGuide Predict — Corporate Green</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#06091A; color:#fff; font-family:'Inter', -apple-system, system-ui, sans-serif; height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px 0; background: radial-gradient(ellipse at 50% 0%, rgba(0,137,61,0.07) 0%, #06091A 60%); gap:16px; }
  #tweaks-btn { appearance:none; border:1px solid rgba(0,137,61,0.35); background:rgba(0,137,61,0.12); color:#9DBFAA; padding:8px 18px; border-radius:99px; font:500 12px/1 'Inter',system-ui,sans-serif; letter-spacing:0.5px; cursor:pointer; transition:background .15s,color .15s; }
  #tweaks-btn:hover { background:rgba(0,137,61,0.25); color:#E8F5EE; }
  html[data-theme='light'] #tweaks-btn { color:#00893d; border-color:rgba(0,137,61,0.45); background:rgba(0,137,61,0.10); }
  html[data-theme='light'] #tweaks-btn:hover { background:rgba(0,137,61,0.18); color:#006a2f; }
  #root { display:flex; align-items:center; justify-content:center; }
  .sg-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .sg-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<script>
  (function() {
    try {
      var m = localStorage.getItem('sg-theme') || 'dark';
      if (m === 'light') {
        document.documentElement.style.background = '#EAEEF5';
        document.body.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(0,137,61,0.06) 0%, #EAEEF5 60%)';
        document.body.style.color = '#0B1020';
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<div id="root"></div>
<button id="tweaks-btn" onclick="window.__setTweaksOpen?.(true)">⚙ Tweaks</button>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
